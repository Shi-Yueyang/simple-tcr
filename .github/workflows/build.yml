name: Build Executables

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: simple-tcr-linux
            asset_name: simple-tcr-linux-amd64
          - os: windows-latest
            artifact_name: simple-tcr-windows
            asset_name: simple-tcr-windows-amd64.exe

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install .

      - name: Build executable
        run: |
          pyinstaller --onefile --name simple-tcr --icon icon.ico run.py
      
      - name: Copy config file
        run: |
          cp simple-tcr.json dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            dist/simple-tcr*
            dist/simple-tcr.json
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Rename artifacts
        run: |
          mv artifacts/simple-tcr-linux/simple-tcr artifacts/simple-tcr-linux-amd64
          mv artifacts/simple-tcr-windows/simple-tcr.exe artifacts/simple-tcr-windows-amd64.exe
          cp artifacts/simple-tcr-linux/simple-tcr.json artifacts/simple-tcr-linux-amd64.json
          cp artifacts/simple-tcr-windows/simple-tcr.json artifacts/simple-tcr-windows-amd64.json

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/simple-tcr-linux-amd64
            artifacts/simple-tcr-linux-amd64.json
            artifacts/simple-tcr-windows-amd64.exe
            artifacts/simple-tcr-windows-amd64.json
