[project]
name = "simple-tcr"
version = "0.1.0"
description = "Headless TCR (Track Circuit Reader) protocol simulator"
requires-python = ">=3.8"
dependencies = ["pyserial"]

[project.scripts]
tcr = "tcr.__main__:main"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"
